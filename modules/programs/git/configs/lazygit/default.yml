# https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md#default

# Use delta to show diffs
#  https://lazygit.dev/docs/configuration/

git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never
    - colorArg: always
      command: delta --dark --paging=never --side-by-side --line-numbers
    - type: extDiff
      command: difft --color=always
