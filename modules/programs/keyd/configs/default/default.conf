# This config applies to all keyboards that did not match a more specific file

# IMPORTANT!!!
#  Do not add all devices with *, when keyd grabs a device it does not allow
#  other programs to control it. This is what caused the MxMaster 3 mouse not
#  being able to smooth scroll (keyd wasn't letting Openlogi access the device).
#  Add each device manually. To check the device id use `sudo keyd monitor`
[ids]
# *

[main]
include config
