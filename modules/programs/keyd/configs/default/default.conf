# IMPORTANT!!!
#   Do not use `*` to match all devices. This will not only grab keyboards, but
#   also mouse, headsets and more.
#
#   Once keyd controls a device it does not allow other programs to do so. This
#   is what caused the issue of not being able to use smooth scrolling with the
#   MxMaster 3 — keyd did not let Openlogi take control of the device.
#
#   Add each device manually. Use `sudo keyd monitor` to find out the device id.

[ids]
# *

[main]
include config
